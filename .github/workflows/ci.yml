name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 语法检查
        run: python -m compileall zkt
      - name: 安装验证(含依赖声明完整性)
        run: |
          python -m pip install --upgrade pip
          pip install .
          zkt -h

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 密钥扫描
        run: |
          ! grep -rnE "sk-[A-Za-z0-9]{16,}|AKIA[0-9A-Z]{16}|BEGIN (RSA |EC )?PRIVATE KEY" \
            --include="*.py" --include="*.md" --include="*.toml" --include="*.yml" .
      - name: 个人路径扫描
        run: |
          ! grep -rn "/Users/\|C:\\\\Users\\\\" --include="*.py" --include="*.md" .
      - name: 敏感文件不得被跟踪
        run: |
          tracked=$(git ls-files)
          echo "$tracked" | grep -qE "^\.env$|^zk/|^graph\.html$|^guide\.html$|^skills/|^\.claude/" \
            && { echo "敏感文件被跟踪:"; echo "$tracked" | grep -E "^\.env$|^zk/|graph\.html|guide\.html|^skills/|^\.claude/"; exit 1; } \
            || echo "OK: 敏感文件全部未跟踪"
