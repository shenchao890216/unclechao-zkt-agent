[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unclechao-zkt-agent"
version = "0.1.0"
description = "卢曼卡片盒对话式 agent —— 用自然语言消化、连接、审核你的想法,转正签字权永远在人手里"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "openai>=1.0",
    "python-dotenv>=1.0",
    "textual>=8.0",
    "python-frontmatter>=1.0",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "html2text>=2024.2.26",
]

[project.scripts]
zkt = "zkt._entry:run"

[tool.hatch.build.targets.wheel]
packages = ["zkt"]
